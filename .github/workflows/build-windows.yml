# Windows 打包工作流
# 触发方式：手动运行（workflow_dispatch）或推送 tag
name: Build Windows Package

on:
  workflow_dispatch:  # 手动触发
  push:
    tags:
      - 'v*'  # 推送版本标签时自动构建

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write  # 允许创建 Release
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
    
    - name: 安装 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
    
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: 下载 ffmpeg
      shell: pwsh
      run: |
        $ffmpegDir = "dist/MeetingScribe/ffmpeg"
        New-Item -ItemType Directory -Force -Path $ffmpegDir | Out-Null
        $zipPath = "build/ffmpeg.zip"
        Invoke-WebRequest -Uri "https://github.com/BtbN/ffmpeg-builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile $zipPath
        Expand-Archive -Path $zipPath -DestinationPath "build/ffmpeg-temp" -Force
        $ffmpegExe = Get-ChildItem -Path "build/ffmpeg-temp" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
        Copy-Item $ffmpegExe.FullName -Destination $ffmpegDir
        Remove-Item $zipPath
        Remove-Item -Recurse -Force "build/ffmpeg-temp"
        Write-Host "ffmpeg 下载完成"
    
    - name: PyInstaller 打包
      run: |
        pyinstaller --clean --noconfirm build/pyinstaller.spec
    
    - name: 组装分发物
      shell: pwsh
      run: |
        $distDir = "dist/MeetingScribe"
        
        # 移动 exe
        if (Test-Path "dist/MeetingScribe.exe") {
            Move-Item "dist/MeetingScribe.exe" "$distDir/MeetingScribe.exe" -Force
        }
        
        # 复制启动器
        Copy-Item "build/launcher.bat" "$distDir/启动.bat"
        
        # 复制 .env 模板并注入服务端密钥
        Copy-Item ".env.example" "$distDir/.env"
        if ($env:ALIBABA_CLOUD_ACCESS_KEY_ID) {
            (Get-Content "$distDir/.env" -Raw) -replace 'ALIBABA_CLOUD_ACCESS_KEY_ID=', "ALIBABA_CLOUD_ACCESS_KEY_ID=$env:ALIBABA_CLOUD_ACCESS_KEY_ID" | Set-Content "$distDir/.env" -NoNewline
        }
        if ($env:ALIBABA_CLOUD_ACCESS_KEY_SECRET) {
            (Get-Content "$distDir/.env" -Raw) -replace 'ALIBABA_CLOUD_ACCESS_KEY_SECRET=', "ALIBABA_CLOUD_ACCESS_KEY_SECRET=$env:ALIBABA_CLOUD_ACCESS_KEY_SECRET" | Set-Content "$distDir/.env" -NoNewline
        }
        
        # 创建数据目录
        New-Item -ItemType Directory -Force -Path "$distDir/data/output" | Out-Null
        New-Item -ItemType Directory -Force -Path "$distDir/data/recordings" | Out-Null
        New-Item -ItemType Directory -Force -Path "$distDir/data/tasks" | Out-Null
        New-Item -ItemType Directory -Force -Path "$distDir/data/uploads" | Out-Null
        
        Write-Host "分发物组装完成"
      env:
        ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
        ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
    
    - name: 创建 ZIP 包
      shell: pwsh
      run: |
        Compress-Archive -Path "dist/MeetingScribe/*" -DestinationPath "MeetingScribe-Windows-x64.zip"
        $size = (Get-Item "MeetingScribe-Windows-x64.zip").Length / 1MB
        Write-Host "分发包大小: $([math]::Round($size, 2)) MB"
    
    - name: 上传产物
      uses: actions/upload-artifact@v4
      with:
        name: MeetingScribe-Windows
        path: MeetingScribe-Windows-x64.zip
        retention-days: 30
    
    - name: 发布 Release（仅 tag 触发）
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: MeetingScribe-Windows-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
