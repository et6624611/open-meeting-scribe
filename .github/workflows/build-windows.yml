# Windows 打包工作流
# 触发方式：仅手动运行（workflow_dispatch）——当前只发 macOS 版，Windows 需要时在 Actions 页手动跑
name: Build Windows Package

on:
  workflow_dispatch:  # 手动触发

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write  # 允许创建 Release
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
    
    - name: 安装 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
    
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: 下载 ffmpeg + ffprobe
      shell: pwsh
      run: |
        $ffmpegDir = "dist/OpenMeetingScribe/ffmpeg"
        New-Item -ItemType Directory -Force -Path $ffmpegDir | Out-Null
        $zipPath = "build/ffmpeg.zip"
        Invoke-WebRequest -Uri "https://github.com/BtbN/ffmpeg-builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile $zipPath
        Expand-Archive -Path $zipPath -DestinationPath "build/ffmpeg-temp" -Force
        # 复制 ffmpeg.exe
        $ffmpegExe = Get-ChildItem -Path "build/ffmpeg-temp" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
        Copy-Item $ffmpegExe.FullName -Destination $ffmpegDir
        # 复制 ffprobe.exe（用于音频时长检测）
        $ffprobeExe = Get-ChildItem -Path "build/ffmpeg-temp" -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
        if ($ffprobeExe) {
            Copy-Item $ffprobeExe.FullName -Destination $ffmpegDir
            Write-Host "ffprobe.exe 已复制"
        } else {
            Write-Host "警告: ffprobe.exe 未在压缩包中找到"
        }
        Remove-Item $zipPath
        Remove-Item -Recurse -Force "build/ffmpeg-temp"
        Write-Host "ffmpeg + ffprobe 下载完成"
    
    - name: 注入桌面端云端服务凭据
      # 将 GitHub Secrets 写入 desktop-secrets.env，PyInstaller 打包时嵌入到 exe 内
      # Write GitHub Secrets to desktop-secrets.env; PyInstaller embeds it into the exe bundle
      shell: pwsh
      env:
        OMS_CLOUD_API_URL:   ${{ secrets.OMS_CLOUD_API_URL }}
        OMS_CLOUD_API_TOKEN: ${{ secrets.OMS_CLOUD_API_TOKEN }}
        OMS_SMS_PROXY_URL:   ${{ secrets.OMS_SMS_PROXY_URL }}
        OMS_SMS_PROXY_TOKEN: ${{ secrets.OMS_SMS_PROXY_TOKEN }}
      run: |
        if (-not $env:OMS_CLOUD_API_TOKEN) {
          Write-Host "⚠ 未配置 OMS_CLOUD_API_TOKEN 等 GitHub Secrets，打包版云端代理功能将不可用"
        } else {
          $lines = @(
            "CLOUD_API_URL=$env:OMS_CLOUD_API_URL",
            "CLOUD_API_TOKEN=$env:OMS_CLOUD_API_TOKEN",
            "SMS_PROXY_URL=$env:OMS_SMS_PROXY_URL",
            "SMS_PROXY_TOKEN=$env:OMS_SMS_PROXY_TOKEN"
          )
          $lines | Set-Content -Path "desktop-secrets.env" -Encoding UTF8
          Write-Host "✓ desktop-secrets.env 已生成"
        }

    - name: 安装 Node.js（前端构建，产物同步到 spec 打包数据源 app/static）
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: 安装前端依赖并构建
      working-directory: frontend
      run: |
        npm ci
        npm run build

    - name: 同步 dist 到 app/static
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path app/static | Out-Null
        Copy-Item -Recurse -Force frontend/dist/* app/static/
        if (-not (Test-Path "app/static/index.html")) {
          Write-Host "app/static/index.html 缺失，前端同步失败"; exit 1
        }
        Write-Host "app/static 同步完成"

    - name: PyInstaller 打包
      run: |
        pyinstaller --clean --noconfirm build/pyinstaller.spec
    
    - name: 诊断 dist 目录
      shell: pwsh
      run: |
        Write-Host "=== dist 目录内容 ==="
        Get-ChildItem -Path "dist" -Recurse | Select-Object FullName, Length | Format-Table -AutoSize
    
    - name: 组装分发物
      shell: pwsh
      run: |
        $distDir = "dist/OpenMeetingScribe"
        
        # 查找并移动 exe（PyInstaller 输出名称可能为 OpenMeetingScribe.exe 或 MeetingScribe.exe）
        $exeFound = $false
        foreach ($name in @("OpenMeetingScribe.exe", "MeetingScribe.exe")) {
            if (Test-Path "dist/$name") {
                Move-Item "dist/$name" "$distDir/$name" -Force
                Write-Host "已移动 $name 到分发目录"
                $exeFound = $true
                break
            }
        }
        if (-not $exeFound) {
            Write-Error "未找到主程序 exe！dist 目录中不存在 OpenMeetingScribe.exe 或 MeetingScribe.exe"
            exit 1
        }
        
        # 复制启动器
        Copy-Item "build/launcher.bat" "$distDir/启动.bat"
        
        # 复制 .env 模板（仅模板，不注入任何云厂商密钥）
        # 客户端走 ASR/SMS 云端代理，密钥由代理服务器持有，分发包不得包含 AccessKey，
        # 否则会将开发者云凭据泄露给所有下载分发包的用户。
        # 注意：保留 .env.example 原文件名，启动.bat 会检测 .env 不存在时自动从模板复制并提示用户编辑。
        Copy-Item ".env.example" "$distDir/.env.example"
        
        # 创建数据目录
        New-Item -ItemType Directory -Force -Path "$distDir/data/output" | Out-Null
        New-Item -ItemType Directory -Force -Path "$distDir/data/recordings" | Out-Null
        New-Item -ItemType Directory -Force -Path "$distDir/data/tasks" | Out-Null
        New-Item -ItemType Directory -Force -Path "$distDir/data/uploads" | Out-Null
        
        Write-Host "分发物组装完成"
    
    - name: 创建 ZIP 包
      shell: pwsh
      run: |
        Compress-Archive -Path "dist/OpenMeetingScribe/*" -DestinationPath "OpenMeetingScribe-Windows-x64.zip"
        $size = (Get-Item "OpenMeetingScribe-Windows-x64.zip").Length / 1MB
        Write-Host "分发包大小: $([math]::Round($size, 2)) MB"
    
    - name: 安装 Inno Setup
      shell: pwsh
      run: |
        choco install innosetup -y --no-progress
        # 确认 iscc 可用
        $isccPath = Get-Command iscc -ErrorAction SilentlyContinue
        if (-not $isccPath) {
            # Chocolatey 安装路径可能在 PATH 中延迟生效，手动添加
            $innoDir = "C:\Program Files (x86)\Inno Setup 6"
            if (Test-Path $innoDir) {
                $env:PATH = "$innoDir;$env:PATH"
                Write-Host "已手动添加 Inno Setup 到 PATH"
            }
        }
        iscc /? 2>&1 | Select-Object -First 1
        Write-Host "Inno Setup 安装完成"

    - name: 准备 Inno Setup 中文语言包
      shell: pwsh
      run: |
        # ChineseSimplified.isl 来自第三方翻译项目，不在 Inno Setup 默认安装中
        # 尝试下载到 build/ 目录，installer.iss 会通过 FileExists 条件引用
        $islUrl = "https://raw.githubusercontent.com/jrsoftware/innosetup-chinese-simplified-translation/main/ChineseSimplified.isl"
        $islPath = "build/ChineseSimplified.isl"
        try {
            Invoke-WebRequest -Uri $islUrl -OutFile $islPath -TimeoutSec 15 -ErrorAction Stop
            Write-Host "中文语言包下载成功"
        } catch {
            Write-Host "警告: 无法下载中文语言包 ($($_.Exception.Message))，安装器将仅包含英文"
        }

    - name: 编译 Inno Setup 安装器
      shell: pwsh
      run: |
        # 从 VERSION 文件读取版本号
        $version = (Get-Content VERSION -Raw).Trim()
        Write-Host "版本号: $version"
        # 确保 iscc 在 PATH 中
        $innoDir = "C:\Program Files (x86)\Inno Setup 6"
        if (Test-Path $innoDir) { $env:PATH = "$innoDir;$env:PATH" }
        # 编译安装器
        iscc build\installer.iss /DMyAppVersion=$version
        # 诊断输出
        Write-Host "=== 安装器产物 ==="
        Get-ChildItem dist\*.exe | Select-Object FullName, @{N='SizeMB';E={[math]::Round($_.Length/1MB, 2)}} | Format-Table -AutoSize

    - name: 上传产物
      uses: actions/upload-artifact@v4
      with:
        name: OpenMeetingScribe-Windows
        path: |
          OpenMeetingScribe-Windows-x64.zip
          dist/OpenMeetingScribe-*-Setup.exe
        retention-days: 7

    - name: 发布 Release（仅 tag 触发）
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          OpenMeetingScribe-Windows-x64.zip
          dist/OpenMeetingScribe-*-Setup.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
