# 本地可选计算引擎 CI（WP-D）— Windows PyInstaller + FunASR 冻结冒烟 & AC-7 云包体积守护
#
# 背景：R8 Spike 已验证 macOS 冻结 PASS（R8 本地引擎 Spike 报告 §3），
# Windows 为残余风险最高点，本 workflow 为 PRD §13 WP-D「实施首个 CI 任务」。
#
# 三个 job：
#   0. offline-load-guard —— QA-R1 缺陷修复回归（断网加载/预热/engine_override/docx，
#      纯打桩，PR + push 均跑）；
#   1. windows-freeze-smoke —— windows-latest 上 PyInstaller --onedir 冻结含
#      torch+funasr 的引擎替身包并冒烟：import → AutoModel 加载链（替身权重）→
#      spawn 子进程（freeze_support 验证）→ generate 推理代码路径。
#      硬性禁令：CI 不下载任何真实模型 —— 模型为本地 fixture（config.yaml + 随机
#      张量 model.pt），MODELSCOPE_CACHE 指向 fixture 空目录，HF/Transformers 离线。
#   2. cloud-package-size-guard —— AC-7 守护：构建云精简主包（build/pyinstaller.spec，
#      与 build-windows.yml 相同配方、不含 ffmpeg/安装器），静态 + 冻结图 + 体积三重
#      检查本地引擎组件（torch/funasr/modelscope）零侵入。
#
# 触发策略（冻结冒烟单次约 1–2h，成本控制）：
#   - PR：仅跑体积守护（快，~20min）；
#   - push main（触及打包相关文件）：两者都跑；
#   - schedule 每周日：跑冻结冒烟，跟踪 torch/funasr/PyInstaller 上游变化；
#   - workflow_dispatch：按需勾选。
name: CI Local Engine

on:
  workflow_dispatch:
    inputs:
      freeze_smoke:
        description: 运行 Windows 冻结替身冒烟（约 1–2 小时）
        type: boolean
        default: true
      size_guard:
        description: 运行 AC-7 云包体积守护
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - requirements.txt
      - build/pyinstaller.spec
      - core/**
      - app/**
      - .github/workflows/ci-local-engine-v2.yml
      - .github/local-engine/**
  pull_request:
    branches: [main]
    paths:
      - requirements.txt
      - build/pyinstaller.spec
      - core/**
      - app/**
      - .github/workflows/ci-local-engine-v2.yml
      - .github/local-engine/**
  schedule:
    - cron: '30 18 * * 0'  # 每周日 18:30 UTC（北京时间周一凌晨）

concurrency:
  group: local-engine-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  offline-load-guard:
    name: 断网加载守护（QA-R1 DEF-01/02/03/04 后端回归）
    # 纯打桩单元回归（主 venv 无 funasr/torch，零真实模型下载、非 Windows runner），
    # PR 与 push main 都跑；「断网下引擎可加载并推理」的 macOS 活体证据见
    # tests/eval_local_engine/qa_r1fix_offline_probe.py（派工单 §2 DEF-01 Done 判据 2）。
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 安装 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: 安装依赖（与主 CI 后端测试同源）
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: QA-R1 修复回归 + 本地引擎既有套件
      run: |
        python -m pytest tests/test_qa_r1_defects.py tests/test_local_engine_r1r2r3.py tests/test_local_engine_wph.py -v

  windows-freeze-smoke:
    name: Windows 冻结引擎替身冒烟（WP-D）
    # PR 不跑（成本）；schedule/dispatch/push main 跑
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.freeze_smoke)
    runs-on: windows-latest
    # 留量依据：Spike 实测 macOS 冻结构建 ~25min、冻结首启 funasr import 最高 86s
    #（Windows 杀软场景更差）；windows-latest 4 核更慢，各 step 另设独立 timeout
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      # 注意：job 级 env 不可用 runner 上下文（会导致整个 workflow 编译失败 →
      # 0s failure / 0 jobs / name 与 paths 元数据全部失效）。动态路径由下方
      # 「导出动态路径」step 写入 GITHUB_ENV。
      # 硬性禁令：禁真实模型下载 —— 缓存指向 fixture 空目录，全链路离线
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 导出动态路径（FIXTURES / MODELSCOPE_CACHE）
      shell: pwsh
      run: |
        "FIXTURES=$env:RUNNER_TEMP\local-engine-fixtures" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        "MODELSCOPE_CACHE=$env:RUNNER_TEMP\local-engine-fixtures\ms_cache" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

    - name: 安装 Python
      uses: actions/setup-python@v5
      with:
        # 与 R8 Spike 实测环境对齐（Python 3.11 + torch 2.14.0 + funasr 1.4.16）；
        # 引擎外置组件与主应用（3.12）环境独立，见 PRD R5 目录布局约束③
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: .github/local-engine/requirements-smoke.txt

    - name: 安装冒烟依赖（torch CPU 版，避免 CUDA 巨包）
      run: |
        python -m pip install --upgrade pip
        pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
        pip install -r .github/local-engine/requirements-smoke.txt

    - name: 生成替身 fixture（随机张量权重 + 3s wav + 空模型缓存）
      run: |
        python .github/local-engine/make_fixtures.py --out "$env:FIXTURES"

    - name: 未冻结基线冒烟（先区分脚本逻辑错误与冻结问题）
      timeout-minutes: 20
      run: |
        python .github/local-engine/stub_engine.py --fixtures "$env:FIXTURES"

    - name: PyInstaller --onedir 冻结（collect-all funasr/modelscope/torch，对齐 Spike 配方）
      timeout-minutes: 75
      run: |
        python -m PyInstaller --clean --noconfirm --onedir --name local_engine_stub `
          --collect-all funasr --collect-all modelscope --collect-all torch `
          --distpath dist_stub --workpath build_stub --specpath build_stub `
          .github/local-engine/stub_engine.py 2>&1 | Tee-Object -FilePath wp-d-pyinstaller.log
        if ($LASTEXITCODE -ne 0) { Write-Host "PyInstaller 构建失败"; exit 1 }

    - name: 冻结冒烟（import → spawn 子进程 → 加载链 → 推理路径）
      # 冻结首启 import 慢（Spike 实测 funasr 最高 86s，Windows Defender 实时扫描更差），
      # spawn 子进程还要再引导一次冻结运行时 —— timeout 留量至 30min
      timeout-minutes: 30
      run: |
        $exe = "dist_stub\local_engine_stub\local_engine_stub.exe"
        if (-not (Test-Path $exe)) { Write-Host "冻结产物不存在: $exe"; exit 1 }
        & $exe --fixtures "$env:FIXTURES" 2>&1 | Tee-Object -FilePath wp-d-frozen-smoke.log
        $code = $LASTEXITCODE
        if ($code -ne 0) { Write-Host "冻结冒烟退出码: $code"; exit 1 }
        if (-not (Select-String -Path wp-d-frozen-smoke.log -Pattern '\[STUB\] PASS' -Quiet)) {
          Write-Host "冻结冒烟日志未见 [STUB] PASS"; exit 1
        }
        # 确认零真实模型下载：fixture 的 ms_cache 必须仍为空目录
        $leaked = Get-ChildItem "$env:MODELSCOPE_CACHE" -Recurse -File -ErrorAction SilentlyContinue
        if ($leaked) { Write-Host "MODELSCOPE_CACHE 出现文件，疑似触发真实模型下载:"; $leaked | ForEach-Object { Write-Host $_.FullName }; exit 1 }
        Write-Host "冻结冒烟 PASS，且未触发任何真实模型下载"

    - name: 上传冒烟日志
      if: always()
      uses: actions/upload-artifact@v4
      # 诊断性上传：账号 artifact 存储配额满时不得把冒烟绿灯 job 判死
      continue-on-error: true
      with:
        name: wp-d-freeze-smoke-logs
        path: |
          wp-d-pyinstaller.log
          wp-d-frozen-smoke.log
        retention-days: 7
        if-no-files-found: ignore

  cloud-package-size-guard:
    name: AC-7 云精简包体积守护
    # schedule 不跑（体积守护由 push/PR 触发即可）
    if: >-
      github.event_name != 'schedule' &&
      (github.event_name != 'workflow_dispatch' || inputs.size_guard)
    runs-on: windows-latest
    timeout-minutes: 75
    permissions:
      contents: read

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 安装 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: 安装依赖（与 build-windows.yml 相同配方）
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: 静态侵入守护（依赖清单 / spec excludes / 模块级 import）
      run: |
        $violations = @()

        # 1) 云包依赖清单不得出现本地引擎组件
        if (Select-String -Path requirements.txt -Pattern '^\s*(torch|torchaudio|funasr|modelscope)\b') {
          $violations += "requirements.txt 混入本地引擎依赖（torch/torchaudio/funasr/modelscope）"
        }

        # 2) 主包 spec 的 excludes 必须保持排除 torch 系
        $spec = Get-Content build/pyinstaller.spec -Raw
        foreach ($m in @("'torch'", "'torchaudio'")) {
          if ($spec -notmatch [regex]::Escape($m)) {
            $violations += "build/pyinstaller.spec excludes 缺少 $m"
          }
        }

        # 3) app/core 不得有模块级本地引擎 import（函数内懒加载也须配合 excludes，
        #    由后续冻结图扫描兜底 —— PyInstaller 静态分析会捕获任意层级 import）
        $hits = Get-ChildItem app, core -Recurse -Filter *.py |
          Select-String -Pattern '^(import|from)\s+(torch|torchaudio|funasr|modelscope)\b'
        if ($hits) {
          $where = ($hits | ForEach-Object { "$($_.Path):$($_.LineNumber)" }) -join ', '
          $violations += "模块级本地引擎 import：$where"
        }

        if ($violations.Count -gt 0) {
          $violations | ForEach-Object { Write-Host "[GUARD] FAIL: $_" }
          exit 1
        }
        Write-Host "[GUARD] 静态侵入守护 PASS"

    - name: 安装 Node.js（前端构建，产物同步到 spec 打包数据源 app/static）
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    - name: 安装前端依赖并构建
      working-directory: frontend
      run: |
        npm ci
        npm run build
    - name: 同步 dist 到 app/static
      run: |
        New-Item -ItemType Directory -Force -Path app/static | Out-Null
        Copy-Item -Recurse -Force frontend/dist/* app/static/
        if (-not (Test-Path "app/static/index.html")) {
          Write-Host "app/static/index.html 缺失，前端同步失败"; exit 1
        }
        Write-Host "app/static 同步完成"

    - name: 构建云精简主包（PyInstaller，与 build-windows.yml 一致，不含 ffmpeg/安装器）
      timeout-minutes: 40
      run: |
        pyinstaller --clean --noconfirm build/pyinstaller.spec
        if (-not (Test-Path "dist/OpenMeetingScribe.exe")) {
          Write-Host "主包产物不存在: dist/OpenMeetingScribe.exe"; exit 1
        }

    - name: 冻结图侵入扫描（Analysis TOC 不得含 torch/funasr/modelscope）
      run: |
        # 结构化解析 TOC 条目（历史缺陷：文本 grep 把 spec excludes 列表误报为侵入）
        python .github/local-engine/toc_scan.py --build-dir build

    - name: 主包体积回归检查（对比基线，超出即 fail）
      run: |
        python .github/local-engine/cloud_size_check.py `
          --exe dist/OpenMeetingScribe.exe `
          --baseline .github/local-engine/cloud-size-baseline.json `
          --report cloud-size-report.json

    - name: 上传体积报告（bootstrap 期用于回填基线）
      if: always()
      uses: actions/upload-artifact@v4
      # 诊断性上传：账号 artifact 存储配额满时不得把体积守护绿灯 job 判死
      continue-on-error: true
      with:
        name: cloud-size-report
        path: cloud-size-report.json
        retention-days: 14
        if-no-files-found: ignore
