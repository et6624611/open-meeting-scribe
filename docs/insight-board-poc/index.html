<style>
  /* ── 设计令牌：与应用 styles/themes 同名，PoC 取 standard-dark 近似值 ── */
  :root {
    --bg: oklch(17% 0.006 260);
    --surface: oklch(21% 0.006 260);
    --surface-2: oklch(25% 0.007 260);
    --surface-3: oklch(29% 0.008 260);
    --fg: oklch(93% 0.004 260);
    --muted: oklch(72% 0.012 260);
    --subtle: oklch(58% 0.012 260);
    --border: oklch(32% 0.008 260);
    --border-strong: oklch(42% 0.01 260);
    --accent: oklch(68% 0.15 250);
    --accent-soft: oklch(68% 0.15 250 / 0.16);
    --ok: oklch(70% 0.14 155);
    --warn: oklch(75% 0.14 85);
    --purple: oklch(70% 0.13 300);
    --info: oklch(72% 0.12 230);
    --rec: oklch(64% 0.19 25);
    --fs-11: 11px; --fs-12: 12px; --fs-13: 13px; --fs-14: 14px;
    --fs-16: 16px; --fs-18: 18px; --fs-22: 22px;
    --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px; --s-6: 32px;
    --radius: 8px; --radius-lg: 12px; --radius-pill: 999px;
    --shadow-float: 0 6px 24px oklch(0% 0 0 / 0.35);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: var(--fs-14)/1.65 -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
    padding: var(--s-6) var(--s-5) var(--s-6);
  }
  .board { max-width: 900px; margin: 0 auto; }

  /* ── 板头 ── */
  .board-head { margin-bottom: var(--s-5); }
  .board-eyebrow {
    display: flex; align-items: center; gap: var(--s-2);
    color: var(--subtle); font-size: var(--fs-12); letter-spacing: .04em;
  }
  .phase-badge {
    padding: 1px var(--s-2); border-radius: var(--radius-pill);
    background: var(--accent-soft); color: var(--accent); font-size: var(--fs-11);
  }
  .board-title { font-size: var(--fs-22); font-weight: 650; margin: var(--s-2) 0 var(--s-1); }
  .board-summary { color: var(--muted); max-width: 720px; }
  .board-stats {
    display: flex; gap: var(--s-4); margin-top: var(--s-3);
    font-size: var(--fs-12); color: var(--subtle); flex-wrap: wrap;
  }
  .board-stats b { color: var(--fg); font-weight: 600; }
  .converge-note {
    margin-top: var(--s-3); padding: var(--s-2) var(--s-3);
    border-left: 3px solid var(--purple); background: var(--surface);
    border-radius: 0 var(--radius) var(--radius) 0;
    color: var(--muted); font-size: var(--fs-12);
  }

  /* ── 区域布局（v0.3 定调）：单列纵向流，全屏不加多栏 ── */
  .zones { display: flex; flex-direction: column; gap: var(--s-4); margin-top: var(--s-4); }

  /* ── 吸顶区域导航：状态点 + 短名 chips，scroll-spy 高亮当前区 ── */
  .zone-nav {
    position: sticky; top: 0; z-index: 20;
    display: flex; gap: var(--s-2); overflow-x: auto;
    padding: var(--s-2) 0; scrollbar-width: none;
    background: oklch(17% 0.006 260 / 0.82); backdrop-filter: blur(10px);
  }
  .zone-nav::-webkit-scrollbar { display: none; }
  .zn-chip {
    flex: none; display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    font-size: var(--fs-12); color: var(--muted); background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius-pill);
    padding: 3px var(--s-3); white-space: nowrap;
  }
  .zn-chip:hover { border-color: var(--border-strong); color: var(--fg); }
  .zn-chip.is-current { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .zn-chip .status-dot { margin-top: 0; width: 7px; height: 7px; }

  .zone {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: var(--s-4) var(--s-4) var(--s-3);
    display: flex; flex-direction: column; gap: var(--s-3);
    scroll-margin-top: 56px; /* 锚点滚动时不被吸顶导航遮挡 */
  }
  .zone-head { display: flex; align-items: flex-start; gap: var(--s-2); }
  .status-dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 7px; flex: none; }
  .status-open     { background: var(--warn); }
  .status-evolving { background: var(--info); }
  .status-settled  { background: var(--ok); }
  .zone-title { font-size: var(--fs-16); font-weight: 640; }
  .zone-meta { display: flex; gap: var(--s-2); flex-wrap: wrap; margin-top: 2px; }
  .chip {
    font-size: var(--fs-11); color: var(--muted); background: var(--surface-2);
    border: 1px solid var(--border); border-radius: var(--radius-pill);
    padding: 0 var(--s-2); line-height: 18px;

  .chip.origin { color: var(--purple); border-color: oklch(70% 0.13 300 / .35); }
  .zone-summary { color: var(--subtle); font-size: var(--fs-12); }

  /* ── 折叠详情层：默认隐藏，主动展开可见（v0.2 图主导定调） ── */
  .zone-details { border-top: 1px dashed var(--border); padding-top: var(--s-2); }
  .zone-details > summary {
    cursor: pointer; font-size: var(--fs-11); color: var(--subtle);
    letter-spacing: .04em; user-select: none;
  }
  .zone-details[open] > summary { color: var(--muted); margin-bottom: var(--s-2); }
  .zone-details .cell:first-child { border-top: none; padding-top: 0; }

  .cell-primary .stage { padding: var(--s-3); }

  .cell-primary .step { font-size: var(--fs-13); padding: 3px var(--s-3); }
  .cell-primary .map-node { font-size: var(--fs-13); padding: var(--s-1) var(--s-3); }
  .cell-primary .map-edge { font-size: var(--fs-13); }

    background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius);
    padding: var(--s-3); font-size: var(--fs-11); overflow: auto;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;

  /* ── cell：flow 阶段卡 ── */

  .cell-label { font-size: var(--fs-11); color: var(--subtle); letter-spacing: .08em; margin-bottom: var(--s-2); }
  .flow { display: flex; align-items: stretch; gap: var(--s-2); overflow-x: auto; padding-bottom: var(--s-1); }
  .stage {
    flex: 1 1 0; min-width: 150px; background: var(--surface-2);
    border: 1px solid var(--border); border-radius: var(--radius); padding: var(--s-2) var(--s-3);

  .stage-no { font-size: var(--fs-11); color: var(--subtle); }
  .stage-name { font-weight: 600; font-size: var(--fs-13); margin-bottom: var(--s-2); }
  .step {
    display: flex; align-items: baseline; gap: var(--s-1);
    font-size: var(--fs-12); color: var(--fg);
    background: var(--surface-3); border-radius: var(--radius-pill);
    padding: 2px var(--s-2); margin-top: var(--s-1);
  }
  .step.pending { background: transparent; border: 1px dashed var(--border-strong); color: var(--muted); }
  .step-arrow { flex: none; align-self: center; color: var(--subtle); font-size: var(--fs-16); padding: 0 2px; }
  .tlink {
    flex: none; font-size: var(--fs-11); color: var(--accent); cursor: pointer;
    font-variant-numeric: tabular-nums; margin-left: auto;
  }
  .tlink:hover { text-decoration: underline; }

  /* ── cell：gaps 盲点 ── */
  .gap {
    display: flex; gap: var(--s-2); align-items: baseline;
    font-size: var(--fs-13); color: var(--fg);
    padding: var(--s-1) 0;
  }
  .gap::before { content: "?"; flex: none; width: 16px; height: 16px; border-radius: 50%;
    border: 1px dashed var(--warn); color: var(--warn); font-size: var(--fs-11);
    display: inline-flex; align-items: center; justify-content: center; }
  .gap.resolved { color: var(--subtle); text-decoration: line-through; }
  .gap.resolved::before { content: "✓"; border-style: solid; border-color: var(--ok); color: var(--ok); text-decoration: none; }

  /* ── cell：actions ── */
  .action { display: flex; gap: var(--s-2); align-items: baseline; font-size: var(--fs-13); padding: var(--s-1) 0; }
  .action::before { content: "□"; color: var(--accent); flex: none; }

  /* ── cell：map 关系 ── */
  .map-nodes { display: flex; flex-wrap: wrap; gap: var(--s-2); }
  .map-node {
    font-size: var(--fs-12); background: var(--surface-3); border: 1px solid var(--border-strong);
    border-radius: var(--radius); padding: 2px var(--s-2);
  }
  .map-edges { margin-top: var(--s-2); display: flex; flex-direction: column; gap: 2px; }
  .map-edge { font-size: var(--fs-12); color: var(--muted); display: flex; gap: var(--s-2); align-items: baseline; }
  .map-edge .rel { font-weight: 600; }
  .rel.broken { color: var(--rec); }
  .rel.dashed { color: var(--warn); }
  .rel.link   { color: var(--ok); }

  /* ── cell：note ── */
  .note {
    font-size: var(--fs-13); color: var(--muted); font-style: italic;
    border-left: 3px solid var(--accent); padding-left: var(--s-3);
    background: linear-gradient(90deg, var(--accent-soft), transparent 60%);
    border-radius: 0 var(--radius) var(--radius) 0; padding: var(--s-2) var(--s-3);
  }

  /* ── 页尾与提示 ── */
  .board-foot { margin-top: var(--s-6); color: var(--subtle); font-size: var(--fs-12); }
  .board-foot details { margin-top: var(--s-3); }
  .board-foot pre {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: var(--s-4); overflow: auto; font-size: var(--fs-11); line-height: 1.5;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; max-height: 420px;
  }
  .board-foot summary { cursor: pointer; color: var(--accent); }
  #toast {
    position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%);
    background: var(--surface-3); border: 1px solid var(--border-strong);
    border-radius: var(--radius-pill); padding: var(--s-2) var(--s-4);
    font-size: var(--fs-12); box-shadow: var(--shadow-float);
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  #toast.show { opacity: 1; }
</style>
</head>

          { "question": "接口配置是否覆盖退款 / 退汇全部单据类型？", "begin_time": null, "resolved": false }
        ]},
        { "kind": "actions", "items": [
          { "text": "验证三类单据在退款场景下的状态字段变更日志", "owner": null },
          { "text": "测试数据跑通「收款确认退款 → 付款单反写 → 报销单刷新」全链路", "owner": null }
        ]}
      ]
    }
  ]
}
</script>

<script>
/* ── 渲染器：spec → DOM。纯文本消费（escapeHtml），spec 中不存在可执行内容 ── */
const spec = JSON.parse(document.getElementById('board-spec').textContent);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtMs = ms => ms == null ? '' : `${String(Math.floor(ms/60000)).padStart(2,'0')}:${String(Math.floor(ms/1000)%60).padStart(2,'0')}`;
const STATUS_LABEL = { open: '讨论中', evolving: '演化中', settled: '已收敛' };
const MATURITY_LABEL = { draft: '刚冒头', forming: '成形中', confirmed: '已聊透' };

function timeLink(ms) {
  if (ms == null) return '';
  return `<span class="tlink" data-t="${ms}" title="跳转到转写 ${fmtMs(ms)}">${fmtMs(ms)}</span>`;
}

function renderCell(cell, primary) {
  const label = { flow: '流程结构', gaps: '盲点 · 开放问题', actions: '行动建议', map: '关系结构', diagram: '通用图', note: '' }[cell.kind];
  let body = '';
  if (cell.kind === 'flow') {
    body = '<div class="flow">' + cell.stages.map((st, i) =>
      `<div class="stage"><div class="stage-no">阶段 ${String(i+1).padStart(2,'0')}</div>
       <div class="stage-name">${esc(st.name)}</div>
       ${st.steps.map(s => `<div class="step${s.pending ? ' pending' : ''}"><span>${esc(s.label)}</span>${timeLink(s.begin_time)}</div>`).join('')}
       </div>`).join('<div class="step-arrow">→</div>') + '</div>';
  } else if (cell.kind === 'gaps') {
    body = cell.items.map(g =>
      `<div class="gap${g.resolved ? ' resolved' : ''}"><span>${esc(g.question)}</span>${timeLink(g.begin_time)}</div>`).join('');
  } else if (cell.kind === 'actions') {
    body = cell.items.map(a => `<div class="action"><span>${esc(a.text)}</span></div>`).join('');
  } else if (cell.kind === 'map') {
    const nodeById = Object.fromEntries(cell.nodes.map(n => [n.id, n]));
    body = `<div class="map-nodes">${cell.nodes.map(n => `<span class="map-node">${esc(n.label)}</span>${''}`).join('')}</div>
      <div class="map-edges">${cell.edges.map(e =>
        `<div class="map-edge"><span>${esc(nodeById[e.from]?.label || e.from)}</span>
         <span class="rel ${esc(e.kind)}">—${esc(e.label)}→</span>
         <span>${esc(nodeById[e.to]?.label || e.to)}</span></div>`).join('')}</div>`;
  } else if (cell.kind === 'diagram') {
    body = `<div class="diagram-src"><pre>${esc(cell.source)}</pre>
      <div class="diagram-note">diagram cell · 正式版由 MermaidDiagram.vue 渲染（PoC 离线，展示源码）</div></div>`;
  } else if (cell.kind === 'note') {
    body = `<div class="note">${esc(cell.text)}</div>`;
  }
  return `<div class="cell${primary ? ' cell-primary' : ''}">${label ? `<div class="cell-label">${label}</div>` : ''}${body}</div>`;
}

/* v0.2 图主导：每 zone 第一个视觉 cell 为主视觉全幅展示，其余（含文本层）收进折叠详情 */
const VISUAL_KINDS = new Set(['flow', 'map', 'diagram']);
function renderZone(z) {
  const primary = z.cells.find(c => VISUAL_KINDS.has(c.kind)) || null;
  const rest = z.cells.filter(c => c !== primary);
  return `
    <section class="zone" id="zone-${esc(z.id)}">
      <div class="zone-head">
        <span class="status-dot status-${esc(z.status)}" title="${STATUS_LABEL[z.status]}"></span>
        <div>
          <div class="zone-title">${esc(z.title)}</div>
          <div class="zone-meta">
            <span class="chip">${STATUS_LABEL[z.status]}</span>
            <span class="chip">${MATURITY_LABEL[z.maturity]}</span>
            <span class="chip origin">⇢ 由 ${z.origin.length} 张卡收敛</span>
          </div>
        </div>
      </div>
      <div class="zone-summary">${esc(z.summary)}</div>
      ${primary ? renderCell(primary, true) : ''}
      ${rest.length ? `<details class="zone-details"><summary>详情 · ${rest.length} 层文本与附加工（默认隐藏 · 也可直接问 AI）</summary>
        ${rest.map(c => renderCell(c, false)).join('')}</details>` : ''}
    </section>`;
}

document.getElementById('board').innerHTML = `
  <header class="board-head">
    <div class="board-eyebrow">洞察板 · INSIGHT BOARD
      <span class="phase-badge">${spec.phase === 'post_meeting' ? '会后定稿' : '会中演化'}</span>
      <span>revision ${spec.revision}</span>
    </div>
    <h1 class="board-title">${esc(spec.header.title)}</h1>
    <div class="board-summary">${esc(spec.header.summary)}</div>
    <div class="board-stats">
      <span><b>${spec.header.stats.zones}</b> 个主题区</span>
      <span><b>${spec.header.stats.open_questions}</b> 个开放问题</span>
      <span><b>${spec.header.stats.actions}</b> 项行动建议</span>
      <span>${esc(spec.header.meeting_date)}</span>
    </div>
    <div class="converge-note">这块板由该会议的 <b>${spec.header.stats.merged_cards}</b> 张洞察卡片按主题收敛而成。
      每个区域以<b>一张图</b>为主导；盲点清单、行动建议等文本收进「详情」折叠层，默认隐藏——信息完备性由 AI 对话承担，板只负责让你看见全局。</div>
  </header>
  <nav class="zone-nav" id="zoneNav" aria-label="区域导航">
    ${spec.zones.map(z => `<span class="zn-chip" data-z="${esc(z.id)}">
      <span class="status-dot status-${esc(z.status)}"></span>${esc(z.title)}</span>`).join('')}
  </nav>
  <main class="zones">${spec.zones.map(renderZone).join('')}
  </main>
  <footer class="board-foot">
    PoC 说明（v0.3）：单列纵向流（全屏不加多栏）；顶部吸顶区域导航 = 板的缩略图（状态点 + 短名，点击平滑滚动，scroll-spy 高亮）；
    主视觉 = 每区第一个视觉 cell 全幅展示；文本层默认折叠；「主数据一致性」区演示多视觉 cell 规则（map 为主、diagram 进折叠层）；
    时间徽标为桩交互；「已收敛」状态点即替代未读角标的通知语义。
    <details><summary>查看 Board Spec JSON（LLM 未来的输出物，页面唯一事实源）</summary>
      <pre>${esc(JSON.stringify(spec, null, 2))}</pre></details>
  </footer>`;

/* 区域导航：点击平滑滚动 + scroll-spy 高亮当前区 */
const zoneNav = document.getElementById('zoneNav');
const zoneSections = spec.zones.map(z => document.getElementById('zone-' + z.id));
zoneNav.addEventListener('click', e => {
  const chip = e.target.closest('.zn-chip');
  if (!chip) return;
  document.getElementById('zone-' + chip.dataset.z)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
});
function spyZones() {
  let idx = 0;
  zoneSections.forEach((s, i) => { if (s && s.getBoundingClientRect().top < 120) idx = i; });
  zoneNav.querySelectorAll('.zn-chip').forEach((c, i) => c.classList.toggle('is-current', i === idx));
}
window.addEventListener('scroll', spyZones, { passive: true });
spyZones();

/* 时间徽标桩交互 */
const toast = document.getElementById('toast');
document.addEventListener('click', e => {
  const t = e.target.closest('.tlink');
  if (!t) return;
  toast.textContent = `跳转到转写原文 ${fmtMs(+t.dataset.t)}（PoC 桩）`;
  toast.classList.add('show');
  clearTimeout(toast._h);
  toast._h = setTimeout(() => toast.classList.remove('show'), 1800);
});
</script>
</body>
</html>
